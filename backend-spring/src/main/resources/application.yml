springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

spring:
  application:
    name: script-manager-backend

  datasource:
    url: jdbc:h2:file:${DB_PATH:src-tauri/database};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;USER=sa;PASSWORD=
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none # Flyway owns the schema (replaces Prisma _db_push)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true

  # Flyway creates/upgrades the schema from db/migration/*.sql
  flyway:
    enabled: true

  # Task executor for async operations (if needed)
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100

server:
  port: 7070

app:
  tracing:
    enabled: ${ENABLE_TRACE:false}


management:
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of requests (1.0 = all, 0.0 = none)

logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} %-5level %logger{35} - %msg%n'
  level:
    com.scriptmanager.common.config.BetterTreeSpanExporter: DEBUG
    com.scriptmanager.common.config.TracingConfig: INFO

